<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Control Panel v2</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { background: #080808; color: #00ff41; font-family: 'Consolas', monospace; display: flex; height: 100vh; margin: 0; }
        
        /* Список чатов слева */
        .sidebar { 
            width: 320px; background: #0f0f0f; border-right: 2px solid #1a1a1a; 
            display: flex; flex-direction: column; overflow-y: auto;
        }
        .chat-item { 
            padding: 15px; border-bottom: 1px solid #1a1a1a; cursor: pointer; 
            transition: 0.2s; font-size: 14px; color: #888;
        }
        .chat-item:hover { background: #1a1a1a; color: #fff; }
        .chat-item.active { background: #1a1a1a; color: #00ff41; border-left: 4px solid #00ff41; }

        /* Основная часть */
        .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        #sendBtn {
            width: 250px; height: 250px; border-radius: 50%; border: 4px solid #333;
            background: radial-gradient(circle, #ff0000 0%, #800000 100%);
            color: white; font-size: 30px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3); transition: 0.1s;
        }
        #sendBtn:active { transform: scale(0.92); box-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
        #sendBtn:disabled { filter: grayscale(1); cursor: not-allowed; opacity: 0.5; }

        .current-target { position: absolute; top: 20px; font-size: 18px; color: #fff; }
        .loader { font-size: 12px; color: #555; padding: 20px; }
    </style>
</head>
<body>

<div class="sidebar" id="chatList">
    <div class="loader">Загрузка чатов из Telegram...</div>
</div>

<div class="main">
    <div class="current-target" id="targetName">ЦЕЛЬ НЕ ВЫБРАНА</div>
    <button id="sendBtn" disabled>ПУСК</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAOt8uJppnWr5CSQUx9rO2gmo77P_SQM4Y",
        authDomain: "typing-939e2.firebaseapp.com",
        projectId: "typing-939e2",
        databaseURL: "https://typing-939e2-default-rtdb.firebaseio.com/",
        storageBucket: "typing-939e2.firebasestorage.app",
        messagingSenderId: "707148868078",
        appId: "1:707148868078:web:96873ff3eef04297e9c6ff"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let selectedChatId = null;

    // Подгружаем список чатов
    db.ref('chats/list').on('value', (snapshot) => {
        const chats = snapshot.val();
        const listDiv = document.getElementById('chatList');
        listDiv.innerHTML = "";
        
        if (chats) {
            Object.keys(chats).forEach(id => {
                const chat = chats[id];
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerText = chat.name;
                div.onclick = () => selectChat(id, chat.name, div);
                listDiv.appendChild(div);
            });
        }
    });

    function selectChat(id, name, element) {
        selectedChatId = id;
        document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('targetName').innerText = "ЦЕЛЬ: " + name;
        document.getElementById('sendBtn').disabled = false;
        
        // Записываем ID текущей цели в базу для бота
        db.ref('commands/target_id').set(id);
    }

    document.getElementById('sendBtn').onclick = () => {
        if (selectedChatId) {
            db.ref('commands/trigger').set(Date.now());
        }
    };
</script>
</body>
</html>
