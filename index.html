<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .sidebar { width: 300px; background: #0a0a0a; border-right: 1px solid #222; overflow-y: auto; }
        .chat-item { padding: 12px; border-bottom: 1px solid #111; cursor: pointer; color: #666; font-size: 13px; }
        .chat-item:hover { background: #111; color: #eee; }
        .chat-item.active { background: #1a1a1a; color: #00ff41; border-left: 3px solid #00ff41; }
        .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        #sendBtn {
            width: 220px; height: 220px; border-radius: 50%; border: none;
            background: radial-gradient(circle, #ff1111 0%, #880000 100%);
            color: #fff; font-size: 24px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2); transition: 0.1s;
        }
        #sendBtn:active { transform: scale(0.95); box-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
        #sendBtn:disabled { filter: grayscale(1); opacity: 0.3; cursor: not-allowed; }
        .status { margin-bottom: 20px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }

        .recent-box {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 340px;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #222;
            box-shadow: 0 0 18px rgba(0, 255, 65, 0.08);
            padding: 14px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .recent-title {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ff41;
        }
        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 5px; /* Для скроллбара */
        }
        .recent-list::-webkit-scrollbar { width: 5px; }
        .recent-list::-webkit-scrollbar-thumb { background: #333; }
        .recent-item {
            padding: 8px 10px;
            background: #0f0f0f;
            border: 1px solid #171717;
            color: #b7ffbf;
            font-size: 12px;
            line-height: 1.35;
            cursor: pointer;
            transition: 0.2s;
        }
        .recent-item:hover { border-color: #333; }
        .recent-item.selected-msg {
            background: rgba(0, 255, 65, 0.1);
            border-color: #00ff41;
            box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.2);
        }
        .recent-item .meta {
            color: #4f8f5b;
            font-size: 11px;
            margin-bottom: 3px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        #targetToggleBtn {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #555;
            border: 1px solid #333;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        #targetToggleBtn.active-target {
            background: #00ff41;
            color: #000;
            border-color: #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }
    </style>
</head>
<body>

<div class="sidebar" id="chatList"></div>

<div class="main">
    <div class="recent-box">
        <div class="recent-title">История чата (Live)</div>
        <div class="recent-list" id="recentMessages">
            <div style="color: #444; font-size: 11px;">Ожидание выбора чата...</div>
        </div>
        <button id="targetToggleBtn">🎯 ТАРГЕТ: ВЫКЛ</button>
    </div>

    <div class="status" id="targetName">ВЫБЕРИТЕ ЧАТ</div>
    <button id="sendBtn" disabled>ПУСК</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAOt8uJppnWr5CSQUx9rO2gmo77P_SQM4Y",
        authDomain: "typing-939e2.firebaseapp.com",
        projectId: "typing-939e2",
        databaseURL: "https://typing-939e2-default-rtdb.firebaseio.com/",
        appId: "1:707148868078:web:96873ff3eef04297e9c6ff"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let selectedId = null;
    let isTargeting = false;
    let targetMsgId = null;

    const targetToggleBtn = document.getElementById('targetToggleBtn');

    // Кнопка переключения постоянного таргета
    targetToggleBtn.onclick = () => {
        isTargeting = !isTargeting;
        db.ref('commands/target_locked').set(isTargeting); // Передаем питону состояние
        
        if (isTargeting) {
            targetToggleBtn.classList.add('active-target');
            targetToggleBtn.innerText = "🎯 ТАРГЕТ: ВКЛ (ВЫБЕРИТЕ ЦЕЛЬ)";
        } else {
            targetToggleBtn.classList.remove('active-target');
            targetToggleBtn.innerText = "🎯 ТАРГЕТ: ВЫКЛ";
            targetMsgId = null;
            db.ref('commands/reply_to').remove();
            document.querySelectorAll('.recent-item').forEach(el => el.classList.remove('selected-msg'));
        }
    };

    // Слушаем реальные сообщения из Python (теперь сверху старые, снизу новые)
    db.ref('chats/current_messages').on('value', (snap) => {
        const msgs = snap.val();
        const box = document.getElementById('recentMessages');
        box.innerHTML = "";
        
        if (msgs && Array.isArray(msgs)) {
            msgs.forEach((msg) => {
                const div = document.createElement('div');
                div.className = 'recent-item' + (targetMsgId === msg.id ? ' selected-msg' : '');
                div.innerHTML = `
                    <div class="meta">${msg.sender}:</div>
                    <div>${msg.text}</div>
                `;
                
                div.onclick = () => {
                    targetMsgId = msg.id;
                    db.ref('commands/reply_to').set(msg.id); 
                    
                    document.querySelectorAll('.recent-item').forEach(el => el.classList.remove('selected-msg'));
                    div.classList.add('selected-msg');
                    
                    if (isTargeting) {
                        targetToggleBtn.innerText = "🎯 ТАРГЕТ ЗАЛОЧЕН НА: " + msg.sender;
                    }
                };
                box.appendChild(div);
            });
            // Автоскролл в самый низ к новым сообщениям
            box.scrollTop = box.scrollHeight;
        } else {
            box.innerHTML = '<div style="color: #444; font-size: 11px;">Нет сообщений...</div>';
        }
    });

    // Список чатов
    db.ref('chats/list').on('value', (snap) => {
        const chats = snap.val();
        const listDiv = document.getElementById('chatList');
        listDiv.innerHTML = "";
        if (chats) {
            Object.keys(chats).forEach(id => {
                const div = document.createElement('div');
                div.className = 'chat-item' + (selectedId === id ? ' active' : '');
                div.innerText = chats[id].name;
                div.onclick = () => {
                    selectedId = id;
                    document.getElementById('targetName').innerText = "ЦЕЛЬ: " + chats[id].name;
                    document.getElementById('sendBtn').disabled = false;
                    db.ref('commands/target_id').set(id);
                    
                    if (isTargeting) {
                        targetToggleBtn.click(); 
                    }

                    document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                };
                listDiv.appendChild(div);
            });
        }
    });

    // Кнопка пуска
    document.getElementById('sendBtn').onclick = () => {
        if (selectedId) {
            db.ref('commands/trigger').set(Date.now());
            
            // Если таргет выключен (одиночный выстрел) - сбрасываем выделение в интерфейсе
            if (!isTargeting && targetMsgId) {
                targetMsgId = null;
                setTimeout(() => {
                    document.querySelectorAll('.recent-item').forEach(el => el.classList.remove('selected-msg'));
                }, 300); // Небольшая задержка, чтобы Питон успел прочитать ID
            }
        }
    };
</script>
</body>
</html>
