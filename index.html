<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .sidebar { width: 300px; background: #0a0a0a; border-right: 1px solid #222; overflow-y: auto; }
        .chat-item { padding: 12px; border-bottom: 1px solid #111; cursor: pointer; color: #666; font-size: 13px; }
        .chat-item:hover { background: #111; color: #eee; }
        .chat-item.active { background: #1a1a1a; color: #00ff41; border-left: 3px solid #00ff41; }
        .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #sendBtn {
            width: 220px; height: 220px; border-radius: 50%; border: none;
            background: radial-gradient(circle, #ff1111 0%, #880000 100%);
            color: #fff; font-size: 24px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2); transition: 0.1s;
        }
        #sendBtn:active { transform: scale(0.95); box-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
        #sendBtn:disabled { filter: grayscale(1); opacity: 0.3; cursor: not-allowed; }
        .status { margin-bottom: 20px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="sidebar" id="chatList"></div>

<div class="main">
    <div class="status" id="targetName">ВЫБЕРИТЕ ЧАТ</div>
    <button id="sendBtn" disabled>ПУСК</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAOt8uJppnWr5CSQUx9rO2gmo77P_SQM4Y",
        authDomain: "typing-939e2.firebaseapp.com",
        projectId: "typing-939e2",
        databaseURL: "https://typing-939e2-default-rtdb.firebaseio.com/",
        appId: "1:707148868078:web:96873ff3eef04297e9c6ff"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let selectedId = null;

    // Слушаем список чатов в реальном времени
    db.ref('chats/list').on('value', (snap) => {
        const chats = snap.val();
        const listDiv = document.getElementById('chatList');
        listDiv.innerHTML = "";
        if (chats) {
            Object.keys(chats).forEach(id => {
                const div = document.createElement('div');
                div.className = 'chat-item' + (selectedId === id ? ' active' : '');
                div.innerText = chats[id].name;
                div.onclick = () => {
                    selectedId = id;
                    document.getElementById('targetName').innerText = "ЦЕЛЬ: " + chats[id].name;
                    document.getElementById('sendBtn').disabled = false;
                    db.ref('commands/target_id').set(id);
                    // Перерисовка активного класса
                    document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                };
                listDiv.appendChild(div);
            });
        }
    });

    document.getElementById('sendBtn').onclick = () => {
        if (selectedId) {
            db.ref('commands/trigger').set(Date.now());
        }
    };
</script>
</body>
</html>
