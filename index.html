<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .sidebar { width: 300px; background: #0a0a0a; border-right: 1px solid #222; overflow-y: auto; }
        .chat-item { padding: 12px; border-bottom: 1px solid #111; cursor: pointer; color: #666; font-size: 13px; }
        .chat-item:hover { background: #111; color: #eee; }
        .chat-item.active { background: #1a1a1a; color: #00ff41; border-left: 3px solid #00ff41; }
        .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }

        .btn-container { display: flex; gap: 30px; margin-top: 10px; }

        .action-btn {
            width: 180px; height: 180px; border-radius: 50%; border: none;
            color: #fff; font-size: 24px; font-weight: bold; cursor: pointer;
            transition: 0.1s; display: flex; justify-content: center; align-items: center;
        }

        #sendBtn {
            background: radial-gradient(circle, #ff1111 0%, #880000 100%);
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
        }
        #laughBtn {
            background: radial-gradient(circle, #8a2be2 0%, #4b0082 100%);
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.2);
        }

        .action-btn:active { transform: scale(0.95); }
        #sendBtn:active { box-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
        #laughBtn:active { box-shadow: 0 0 10px rgba(138, 43, 226, 0.5); }

        .action-btn:disabled { filter: grayscale(1); opacity: 0.3; cursor: not-allowed; box-shadow: none; }

        .status { margin-bottom: 30px; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; }

        .recent-box {
            position: absolute; top: 16px; left: 16px; width: 340px; background: rgba(10, 10, 10, 0.95);
            border: 1px solid #222; box-shadow: 0 0 18px rgba(0, 255, 65, 0.08); padding: 14px; box-sizing: border-box;
            display: flex; flex-direction: column; gap: 10px;
        }
        .recent-title { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #00ff41; }
        .recent-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; padding-right: 5px; }
        .recent-list::-webkit-scrollbar { width: 5px; }
        .recent-list::-webkit-scrollbar-thumb { background: #333; }
        .recent-item { padding: 8px 10px; background: #0f0f0f; border: 1px solid #171717; color: #b7ffbf; font-size: 12px; line-height: 1.35; cursor: pointer; transition: 0.2s; }
        .recent-item:hover { border-color: #333; }
        .recent-item.selected-msg { background: rgba(0, 255, 65, 0.1); border-color: #00ff41; box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.2); }
        .recent-item .meta { color: #4f8f5b; font-size: 11px; margin-bottom: 3px; font-weight: bold; text-transform: uppercase; }

        #targetToggleBtn {
            width: 100%; padding: 10px; background: #111; color: #555; border: 1px solid #333;
            font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        #targetToggleBtn.active-target { background: #00ff41; color: #000; border-color: #00ff41; box-shadow: 0 0 15px rgba(0, 255, 65, 0.4); }
    </style>
</head>
<body>

<div class="sidebar" id="chatList"></div>

<div class="main">
    <div class="recent-box">
        <div class="recent-title">История чата (Live)</div>
        <div class="recent-list" id="recentMessages">
            <div style="color: #444; font-size: 11px;">Ожидание выбора чата...</div>
        </div>
        <button id="targetToggleBtn">🎯 ТАРГЕТ: ВЫКЛ</button>
    </div>

    <div class="status" id="targetName">ВЫБЕРИТЕ ЧАТ</div>
    <div class="btn-container">
        <button class="action-btn" id="sendBtn" disabled>ПУСК</button>
        <button class="action-btn" id="laughBtn" disabled>СМЕХ</button>
    </div>
</div>

<script>
    const firebaseConfig = {
    apiKey: "AIzaSyB-T0mESVKzIlCOfdeaJCrx_BRLyTYCQV4",
    authDomain: "sspupsij-a248c.firebaseapp.com",
    projectId: "sspupsij-a248c",
    databaseURL: "https://sspupsij-a248c-default-rtdb.firebaseio.com/",
    appId: "1:447023795025:web:8cfa7576d5e7351ba1a170"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let selectedId = null;
    let isTargeting = false;
    let targetMsgId = null;

    const targetToggleBtn = document.getElementById('targetToggleBtn');

    targetToggleBtn.onclick = () => {
        isTargeting = !isTargeting;
        db.ref('commands/target_locked').set(isTargeting);

        if (isTargeting) {
            targetToggleBtn.classList.add('active-target');
            targetToggleBtn.innerText = "🎯 ТАРГЕТ: ВКЛ (ВЫБЕРИТЕ ЦЕЛЬ)";
        } else {
            targetToggleBtn.classList.remove('active-target');
            targetToggleBtn.innerText = "🎯 ТАРГЕТ: ВЫКЛ";
            targetMsgId = null;
            db.ref('commands/reply_to').remove();
            document.querySelectorAll('.recent-item').forEach(el => el.classList.remove('selected-msg'));
        }
    };

    db.ref('chats/current_messages').on('value', (snap) => {
        const msgs = snap.val();
        const box = document.getElementById('recentMessages');
        box.innerHTML = "";

        if (msgs && Array.isArray(msgs)) {
            msgs.forEach((msg) => {
                const div = document.createElement('div');
                div.className = 'recent-item' + (targetMsgId === msg.id ? ' selected-msg' : '');
                div.innerHTML = `
                    <div class="meta">${msg.sender}:</div>
                    <div>${msg.text}</div>
                `;

                div.onclick = () => {
                    targetMsgId = msg.id;
                    db.ref('commands/reply_to').set(msg.id);

                    document.querySelectorAll('.recent-item').forEach(el => el.classList.remove('selected-msg'));
                    div.classList.add('selected-msg');

                    if (isTargeting) {
                        targetToggleBtn.innerText = "🎯 ТАРГЕТ ЗАЛОЧЕН НА: " + msg.sender;
                    }
                };
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        } else {
            box.innerHTML = '<div style="color: #444; font-size: 11px;">Нет сообщений...</div>';
        }
    });

    db.ref('chats/list').on('value', (snap) => {
        const chats = snap.val();
        const listDiv = document.getElementById('chatList');
        // Сохраняем текущий скролл, чтобы при обновлении каждые 15 сек он не прыгал
        const scrollPos = listDiv.scrollTop;
        listDiv.innerHTML = "";
        if (chats) {
            Object.keys(chats).forEach(id => {
                const div = document.createElement('div');
                div.className = 'chat-item' + (selectedId === id ? ' active' : '');
                div.innerText = chats[id].name;
                div.onclick = () => {
                    selectedId = id;
                    document.getElementById('targetName').innerText = "ЦЕЛЬ: " + chats[id].name;
                    document.getElementById('sendBtn').disabled = false;
                    document.getElementById('laughBtn').disabled = false;
                    db.ref('commands/target_id').set(id);

                    if (isTargeting) targetToggleBtn.click();

                    document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                };
                listDiv.appendChild(div);
            });
            listDiv.scrollTop = scrollPos;
        }
    });

    // Функция для сброса таргета при одиночном выстреле
    function handleSingleShot() {
        if (!isTargeting && targetMsgId) {
            targetMsgId = null;

            db.ref('commands/reply_to').remove();

            setTimeout(() => {
                document.querySelectorAll('.recent-item').forEach(
                    el => el.classList.remove('selected-msg')
                );
            }, 300);
        }
    }

    // Кнопка "ПУСК" (txt.txt)
    document.getElementById('sendBtn').onclick = () => {
        if (selectedId) {
            db.ref('commands/trigger').set(Date.now());
            handleSingleShot();
        }
    };

    // Кнопка "СМЕХ" (txtfuny.txt)
    document.getElementById('laughBtn').onclick = () => {
        if (selectedId) {
            db.ref('commands/trigger_laugh').set(Date.now());
            handleSingleShot();
        }
    };
</script>
</body>
</html>
